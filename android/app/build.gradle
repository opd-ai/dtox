plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opd.dtox'
    compileSdk 34

    defaultConfig {
        applicationId "com.opd.dtox"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The Ebiten AAR produced by ebitenmobile bind, placed in app/libs/ by CI.
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}
