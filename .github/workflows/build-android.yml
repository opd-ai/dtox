name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: go mod download

      - name: Install ebitenmobile
        run: |
          EBITEN_VERSION=$(go list -m -f '{{.Version}}' github.com/hajimehoshi/ebiten/v2)
          go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@${EBITEN_VERSION}

      - name: Build Android AAR
        run: |
          mkdir -p android/app/libs
          ebitenmobile bind -target android -javapkg go \
            -o android/app/libs/tox-gui.aar \
            ./mobile/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tox-gui-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
